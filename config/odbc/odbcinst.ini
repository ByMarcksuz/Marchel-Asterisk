;; Configuración de drivers ODBC instalados
;; Archivo: /etc/odbcinst.ini
;;
;; Copia este contenido a /etc/odbcinst.ini para instalar los drivers ODBC
;; Los drivers deben estar instalados previamente en el sistema

;; Driver para MySQL/MariaDB versión 9.x (recomendado)
[MySQL ODBC 9.2 Unicode Driver]
Description=MySQL ODBC 9.2 Unicode Driver para Asterisk
Driver=/usr/lib/x86_64-linux-gnu/odbc/libmyodbc9w.so
UsageCount=1
FileUsage=1

;; Driver ANSI alternativo
[MySQL ODBC 9.2 ANSI Driver]
Description=MySQL ODBC 9.2 ANSI Driver
Driver=/usr/lib/x86_64-linux-gnu/odbc/libmyodbc9a.so
UsageCount=1
FileUsage=1

;; Driver MySQL genérico (alternativa)
[MySQL]
Description=ODBC Driver para MySQL/MariaDB
Driver=/usr/lib/x86_64-linux-gnu/odbc/libmaodbc.so
FileUsage=1

;; Driver para PostgreSQL (para extensiones futuras)
[PostgreSQL ODBC Driver]
Description=PostgreSQL ODBC Driver
Driver=/usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
UsageCount=1
FileUsage=1

;; NOTAS:
;; - Reemplaza /usr/lib/x86_64-linux-gnu/ por /usr/lib/ en sistemas 32-bit
;; - En FreeBSD usa /usr/local/lib/
;; - Verifica que los archivos .so existan con: ldconfig -p | grep myodbc
;; - Para instalar drivers en Debian/Ubuntu: sudo apt install odbc-mysql unixodbc-dev
