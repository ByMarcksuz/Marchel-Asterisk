<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marchel - Tarifas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container tarifas-container">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/logo-marchel.png') }}" alt="Marchel Logo">
        </div>
        <h2>Tarifas Actuales</h2>
        
        <div class="nav-tabs">
            <a href="{{ url_for('dashboard') }}">Panel Principal</a>
            <a href="{{ url_for('estadisticas') }}">Estadísticas</a>
            <a href="{{ url_for('tarifas') }}" class="active">Tarifas</a>
            <a href="{{ url_for('historial') }}">Historial</a>
            <a href="{{ url_for('tendencias') }}">Tendencias</a>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchTarifa" placeholder="Buscar por destino o código...">
        </div>
        
        <div class="tarifas-table-container">
            <table class="tarifas-table">
                <thead>
                    <tr>
                        <th>Destino</th>
                        <th>Horario</th>
                        <th>Tarifa (€/min)</th>
                    </tr>
                </thead>
                <tbody id="tarifasBody">
                    {% for tarifa in tarifas %}
                    <tr>
                        <td>{{ tarifa.destino }}</td>
                        <td>{{ tarifa.horario }}</td>
                        <td class="tarifa-precio">{{ "%.4f"|format(tarifa.costo_por_minuto) }} €</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar Sesión</a>
    </div>
    
    <script>
        // Búsqueda en tiempo real
        document.getElementById('searchTarifa').addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const rows = document.getElementById('tarifasBody').getElementsByTagName('tr');
            
            for (let i = 0; i < rows.length; i++) {
                const codigo = rows[i].getElementsByTagName('td')[0].textContent.toLowerCase();
                const destino = rows[i].getElementsByTagName('td')[1].textContent.toLowerCase();
                
                if (codigo.includes(searchTerm) || destino.includes(searchTerm)) {
                    rows[i].style.display = '';
                } else {
                    rows[i].style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
